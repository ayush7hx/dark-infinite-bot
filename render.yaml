services:
  - type: web
    name: dark-infinite-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python CodeX.py
    envVars:
      - key: TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
